openapi: 3.0.3
info:
  title: Digital Twin Management API
  description: OpenAPI specification for managing the lifecycle of digital twins based on ETSI ZSM principles.
  version: 1.0.0

paths:
  /api/SDTM/digital-twin:
    post:
      summary: Create a new digital twin
      operationId: createDigitalTwin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                twinId:
                  type: string
                  description: Unique identifier for the digital twin
                modelType:
                  type: string
                  description: Type of the digital twin model
                initialParameters:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Digital twin successfully created
        '400':
          description: Invalid input data

  /api/SDTM/digital-twin/{twinId}:
    get:
      summary: Retrieve a digital twin
      operationId: getDigitalTwin
      parameters:
        - name: twinId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Digital twin data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  twinId:
                    type: string
                  modelType:
                    type: string
                  currentState:
                    type: object
                    additionalProperties: true
                  metadata:
                    type: object
                    properties:
                      createdAt:
                        type: string
                        format: date-time
                      lastUpdated:
                        type: string
                        format: date-time
        '404':
          description: Digital twin not found
    
    put:
      summary: Update a digital twin
      operationId: updateDigitalTwin
      parameters:
        - name: twinId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updateParameters:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Digital twin updated successfully
        '400':
          description: Invalid update data
        '404':
          description: Digital twin not found
    
    delete:
      summary: Delete a digital twin
      operationId: deleteDigitalTwin
      parameters:
        - name: twinId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Digital twin deleted successfully
        '404':
          description: Digital twin not found

  /api/SDTM/digital-twin/{twinId}/synchronize:
    post:
      summary: Synchronize a digital twin with its physical counterpart
      operationId: synchronizeDigitalTwin
      parameters:
        - name: twinId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                syncParameters:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Synchronization successful
        '400':
          description: Invalid synchronization data
        '404':
          description: Digital twin not found


components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes: {}

security:
  - OAuth2: []

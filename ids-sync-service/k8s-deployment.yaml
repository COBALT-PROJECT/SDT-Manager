apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-sync-service
  namespace: default
  labels:
    app: ids-sync-service
    component: sync
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ids-sync-service
  template:
    metadata:
      labels:
        app: ids-sync-service
        component: sync
        version: v1.0.0
    spec:
      containers:
      - name: ids-sync
        image: ids-sync-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PROVIDER_URL
          value: "https://tc-provider:8090"
        - name: CONSUMER_URL
          value: "https://tc-consumer:8444"
        - name: IDS_USERNAME
          valueFrom:
            secretKeyRef:
              name: ids-sync-credentials
              key: username
        - name: IDS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ids-sync-credentials
              key: password
        - name: POLL_INTERVAL_SECONDS
          value: "30"
        - name: MAX_RETRIES
          value: "3"
        - name: LOG_LEVEL
          value: "INFO"
        - name: HEALTH_PORT
          value: "8080"
        ports:
        - containerPort: 8080
          name: health
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 2
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Secret
metadata:
  name: ids-sync-credentials
  namespace: default
type: Opaque
data:
  # base64 encoded: admin
  username: YWRtaW4=
  # base64 encoded: password  
  password: cGFzc3dvcmQ=

---
apiVersion: v1
kind: Service
metadata:
  name: ids-sync-service
  namespace: default
  labels:
    app: ids-sync-service
    component: sync
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: health
    protocol: TCP
    name: health
  selector:
    app: ids-sync-service

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ids-sync-config
  namespace: default
  labels:
    app: ids-sync-service
data:
  sync-config.yaml: |
    provider:
      url: "https://tc-provider:8090"
      timeout: 30
    consumer:
      url: "https://tc-consumer:8444"
      timeout: 60
    sync:
      poll_interval_seconds: 30
      max_retries: 3
      resource_types:
        - "ids:TextResource"
    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    health:
      port: 8080
      endpoints:
        - "/health"
        - "/metrics"
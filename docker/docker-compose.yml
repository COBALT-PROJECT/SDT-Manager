version: '3.8'
services:
  sdt-manager:
    image: sdt-manager:latest
    container_name: sdt-manager
    network_mode: host
    environment:
      - KUBECONFIG=/kube/k3s.yaml
      - SDT_INTERFACE_HOST=localhost
      - SDT_INTERFACE_PORT=30008
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8008
      #optional: make the connector path configurable in code
      - CONNECTOR_HOME=/home/ubuntu/true-connector
    volumes:
      - /etc/rancher/k3s/k3s.yaml:/kube/k3s.yaml:ro
      - ./yaml_scripts:/home/ubuntu/k3s-SDT-Ditto/yaml_scripts:ro
      - /home/ubuntu/true-connector/kubernetes:/home/ubuntu/true-connector/kubernetes:ro #mounts the files on the localhost machine to the container 
      - ./logs:/app/logs
    restart: unless-stopped

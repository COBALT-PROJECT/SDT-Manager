version: '3.8'
services:
  sdt-manager:
    image: sdt-manager:latest
    container_name: sdt-manager
    build: .
    network_mode: host
    env_file:
      - .env
    environment:
      # Kubeconfig path inside the container (matches the volume mount below)
      - KUBECONFIG=/kube/k3s.yaml
      # SDT service endpoint (NodePort exposed by the k3s cluster)
      - SDT_INTERFACE_HOST=localhost
      - SDT_INTERFACE_PORT=30008
      # SDT-Manager API server
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8008
      # Kubernetes YAML paths inside the container
      - YAML_PATH=/app/yaml_scripts/
      - IDS_YAML_BASE_PATH=/app/kubernetes/
      # SQLite credential store inside the persistent data volume
      - CREDENTIAL_DB_PATH=/app/data/sdt_credentials.db
      # Identity / wallet — override with real values in production
      - AM_BASE_URL=http://iam.cobalt.local:3100
      - WALLET_CONTROLLER_URL=http://iam.cobalt.local:3200
      - WALLET_CONTROLLER_KEY=atestkeytoremotelycontrolthewallet
      - DIGITAL_TWIN_API_KEY=IvPBXYOesvseJQ3u0mwLPFgvN3Ugy2-P35aW2WlSUvQ
      # Component auth ports
      - SDT_AUTH_PORT=8000
      - IDS_SDT_AUTH_PORT=8004
      - WATCHTOWER_AUTH_PORT=8080
      # DLT/CCMLedger workflow disabled; former configuration retained as comments
      # - CCMLEDGER_HOST=cobalt-dlt.cobalt.local
      # - CCMLEDGER_PORT=3000
      # - CCMLEDGER_SBOM_PATH=/v1/manufacturer/SBOM
      # - CCMLEDGER_ENABLED=false
    volumes:
      # k3s kubeconfig (read-only)
      - /etc/rancher/k3s/k3s.yaml:/kube/k3s.yaml:ro
      # SDT and Watchtower Kubernetes manifests (read-only)
      - ../yaml_scripts:/app/yaml_scripts:ro
      # IDS connector Kubernetes manifests — adjust path to your true-connector checkout
      - /home/ubuntu/true-connector/kubernetes:/app/kubernetes:ro
      # Persistent logs and SQLite credential store
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped

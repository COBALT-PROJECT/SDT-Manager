apiVersion: v1
kind: Service
metadata:
  name: watchtower-service
  labels:
    app: watchtower
spec:
  type: NodePort
  selector:
    app: watchtower
  ports:
  - name: http
    protocol: TCP
    port: 5000
    targetPort: 5000
  - name: grpc
    protocol: TCP
    port: 50051
    targetPort: 50051
    # NodePort will be automatically assigned in range 30000-32767
    # Uncomment the next line if you want to specify a specific NodePort
    # nodePort: 30080
  sessionAffinity: None
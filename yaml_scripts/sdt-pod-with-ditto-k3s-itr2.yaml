apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdt-deployment
  namespace: default
  labels:
    app: sdt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdt
  template:
    metadata:
      labels:
        app: sdt
    spec:
      containers:
        - name: sdt-container
          image: docker.io/arq101/sdt-main-image:0.2.8 # pinned to the locally-built SDT image (do not pull from Docker Hub — tag collides with a public image)
          imagePullPolicy: Never
          ports:
            - containerPort: 8000 #for sdt interface
            - containerPort: 1883 #for mosquitto mqtt broker
          env:
            - name: DITTO_HOST
              value: "ditto"
            - name: DITTO_PORT
              value: "80"
            - name: MQTT_BROKER_HOST
              value: "sdt-service"
            - name: MQTT_BROKER_PORT
              value: "1883"
            - name: CLOUDITOR_IP
              value: "10.163.1.127"
            - name: CLOUDITOR_PORT          # assessment / evidence REST port
              value: "8083"
            - name: CLOUDITOR_AUTH_PORT     # OAuth2 token REST port
              value: "8080"
            - name: CLOUDITOR_SECRET        # OAuth2 client secret for Clouditor
              value: "clouditor"
            - name: IAM_CLIENT_ID           # OAuth2 client_id for COBALT IAM
              value: "sdt"
            - name: IAM_CLIENT_SECRET       # OAuth2 client secret for COBALT IAM (client_id "sdt")
              value: "sd@tm"
            - name: IDS_CONNECTOR_HOST
              value: "ids-connector-sdt-service"
            - name: IDS_CONNECTOR_PORT
              value: "8004"
            - name: COMPONENT_ID            # Faultline component identifier
              value: "SDT"
            - name: FAULTLINE_ENABLED       # port 1883 on FAULTLINE_MQTT_HOST confirmed reachable
              value: "true"
            - name: FAULTLINE_MQTT_HOST
              value: "10.163.1.161"
            - name: FAULTLINE_MQTT_PORT
              value: "1883"
          volumeMounts:
            - name: sdt-output
              mountPath: /app/sdt_output
      volumes:
        - name: sdt-output
          emptyDir: {}
      restartPolicy: Always

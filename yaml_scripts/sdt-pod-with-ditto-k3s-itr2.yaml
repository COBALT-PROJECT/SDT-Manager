apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdt-deployment
  namespace: default
  labels:
    app: sdt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdt
  template:
    metadata:
      labels:
        app: sdt
    spec:
      containers:
        - name: sdt-container
          image: docker.io/arq101/sdt-main-image:0.2.8 # pinned to the latest published SDT image tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000 #for sdt interface
            - containerPort: 1883 #for mosquitto mqtt broker
          env:
            - name: DITTO_HOST
              value: "ditto"
            - name: DITTO_PORT
              value: "80"
            - name: MQTT_BROKER_HOST
              value: "sdt-service"
            - name: MQTT_BROKER_PORT
              value: "1883"
            - name: CLOUDITOR_IP
              value: "10.163.1.127"
            - name: CLOUDITOR_PORT          # assessment / evidence REST port
              value: "8083"
            - name: CLOUDITOR_AUTH_PORT     # OAuth2 token REST port
              value: "8080"
            - name: CLOUDITOR_SECRET        # OAuth2 client secret for Clouditor
              value: "clouditor"
            - name: IDS_CONNECTOR_HOST
              value: "ids-connector-sdt-service"
            - name: IDS_CONNECTOR_PORT
              value: "8004"
          volumeMounts:
            - name: sdt-output
              mountPath: /app/sdt_output
      volumes:
        - name: sdt-output
          emptyDir: {}
      restartPolicy: Always

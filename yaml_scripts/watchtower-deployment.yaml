apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchtower-deployment
  labels:
    app: watchtower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchtower
  template:
    metadata:
      labels:
        app: watchtower
    spec:
      # Node selector to deploy only on the 'watchtower' node
      nodeSelector:
        kubernetes.io/hostname: watchtower
      containers:
      - name: watchtower
        image: nginx:alpine-perl
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        # Add resource limits for better resource management
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Add liveness and readiness probes if your application supports health checks
        # Uncomment and adjust the following if your app has health endpoints
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8080
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /ready
        #     port: 8080
        #   initialDelaySeconds: 5
        #   periodSeconds: 5
      # Restart policy
      restartPolicy: Always